name: p1-ai-task-redis
services:
  redis:
    image: redis:7.4-alpine
    container_name: ai-task-platform-redis
    labels:
      com.ai-task-platform.owner: p1
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Provide REDIS_PASSWORD in process environment}
    # A generated hex secret enters config via stdin, never command arguments or a config file.
    command:
      - sh
      - -ec
      - |
        case "$$REDIS_PASSWORD" in *[!0-9a-fA-F]*|'') exit 2;; esac
        [ "$${#REDIS_PASSWORD}" -ge 32 ] || exit 2
        printf 'bind 0.0.0.0\nprotected-mode yes\nrequirepass %s\nappendonly yes\nmaxmemory 64mb\nmaxmemory-policy noeviction\n' "$$REDIS_PASSWORD" | docker-entrypoint.sh redis-server -
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - p1-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  p1-redis-data:
    name: ai-task-platform-redis-data
